<!-- ventas/templates/ventas/base.html -->
{% load static %}
<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Tienda{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        }

        @layer base {
            body {
                @apply min-h-screen bg-slate-950 font-sans text-slate-100 antialiased;
                background-image:
                    radial-gradient(circle at 10% 10%, rgba(34, 211, 238, .12), transparent 30rem),
                    radial-gradient(circle at 90% 15%, rgba(217, 70, 239, .10), transparent 30rem),
                    radial-gradient(circle at 50% 100%, rgba(34, 197, 94, .08), transparent 30rem);
                background-attachment: fixed;
            }
        }

        .glow-cyan { box-shadow: 0 0 24px rgba(34, 211, 238, .18); }
        .text-glow { text-shadow: 0 0 18px rgba(34, 211, 238, .55); }
    </style>
</head>

<body class="selection:bg-cyan-400/30 selection:text-white">
    <a href="#contenido" class="sr-only z-50 rounded-lg bg-cyan-500 px-4 py-3 font-semibold text-slate-950 focus:not-sr-only focus:absolute focus:left-4 focus:top-4">Saltar al contenido</a>

    <header class="px-4 pt-4 sm:px-6 sm:pt-6">
        <nav aria-label="Navegación principal" class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 rounded-2xl border border-slate-800 bg-slate-900/70 px-4 py-3 shadow-[0_12px_36px_rgba(0,0,0,0.35)] backdrop-blur-xl">
            <a href="{% url 'producto_list' %}" class="flex items-center gap-2.5 rounded-xl px-2 py-1.5 font-bold tracking-tight text-white transition hover:bg-white/5" aria-label="Ir al inicio">
                <img src="{% static 'ventas/logo-estampados.png' %}" alt="Estampados Excelsior" class="h-10 w-10 rounded-full object-contain">
                <span class="text-glow hidden sm:inline">Estampados Excelsior</span>
            </a>
            <div class="flex flex-wrap items-center gap-1 sm:gap-2">
                <a href="{% url 'producto_list' %}" class="rounded-xl px-3 py-2 text-sm font-semibold text-slate-300 transition hover:bg-white/5 hover:text-white">Productos</a>
                <a href="{% url 'venta_list' %}" class="rounded-xl px-3 py-2 text-sm font-semibold text-slate-300 transition hover:bg-white/5 hover:text-white">Ventas</a>
                <a href="{% url 'producto_create' %}" class="rounded-xl border border-slate-700 px-3 py-2 text-sm font-semibold text-slate-200 transition hover:border-cyan-400/50 hover:text-cyan-300">+ Producto</a>
                <a href="{% url 'venta_create' %}" class="inline-flex items-center gap-2 rounded-xl bg-cyan-400 px-3 py-2 text-sm font-bold text-slate-950 shadow-sm transition hover:bg-cyan-300 glow-cyan">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="size-5" aria-hidden="true"><path stroke-linecap="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                    Registrar venta
                </a>
            </div>
        </nav>
    </header>

    {% if messages %}
    <div class="mx-auto mt-4 max-w-6xl px-4 sm:px-6">
        {% for message in messages %}
        <p class="rounded-xl border border-cyan-400/30 bg-cyan-400/10 px-4 py-2.5 text-sm text-cyan-200">{{ message }}</p>
        {% endfor %}
    </div>
    {% endif %}

    <main id="contenido" class="mx-auto w-full max-w-6xl px-4 py-8 sm:px-6 sm:py-12">
        {% block content %}{% endblock %}
    </main>
</body>

</html>
